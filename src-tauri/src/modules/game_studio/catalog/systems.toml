# Catalogue des systèmes de jeu de Game Studio.
#
# L'analyse d'une idée raisonne en SYSTÈMES, jamais en modèles de genre : chaque système est
# reconnu par ses mots-clés (français et anglais, accents et pluriels ignorés), entraîne ses
# dépendances (`depends`) et ses compagnons (`adds`, souvent l'interface qui va avec). Un genre
# (fichier genres.toml) ne fait qu'ajouter des systèmes : il ne limite rien, et un agent peut
# ajouter au projet un système absent d'ici (origine « custom »).
#
# Champs : id (snake_case, stable) · name · category (voir GameSystemCategory) · role ·
# keywords · depends · adds · produces (événements) · data (types de données du système) ·
# network (local | serverAuthority | replicated | predicted | clientOnly : cas multijoueur) ·
# tests (vérifications attendues) · foundation (« all », « 2d », « 3d » : présent d'office) ·
# risk (limite d'échelle à signaler).

# ─── Fondations ─────────────────────────────────────────────────────────────────────────

[[system]]
id = "game_state"
name = "Boucle et états du jeu"
category = "core"
role = "Enchaîne les états (écran titre, partie, pause, fin) et possède le cycle de mise à jour."
keywords = ["boucle de jeu", "game loop", "etat du jeu", "game over", "pause"]
produces = ["GameStarted", "GamePaused", "GameResumed", "GameOver"]
network = "serverAuthority"
tests = ["La partie démarre depuis l'écran titre", "Pause puis reprise sans perte d'état"]
foundation = "all"

[[system]]
id = "input"
name = "Entrées et actions"
category = "core"
role = "Traduit clavier, souris, manette ou tactile en actions nommées, remappables."
keywords = ["controles", "commandes", "input", "clavier", "souris", "remapping", "touches"]
produces = ["ActionPressed", "ActionReleased"]
data = ["InputMap"]
network = "clientOnly"
tests = ["Chaque action répond à ses touches par défaut", "Une touche remappée est gardée après redémarrage"]
foundation = "all"

[[system]]
id = "scene_management"
name = "Scènes et chargements"
category = "core"
role = "Charge, décharge et enchaîne les scènes ou niveaux, avec écran de chargement."
keywords = ["chargement", "loading", "ecran de chargement", "scenes"]
produces = ["SceneLoaded", "SceneUnloaded"]
network = "serverAuthority"
tests = ["Passage d'une scène à l'autre sans fuite de mémoire"]
foundation = "all"

[[system]]
id = "event_bus"
name = "Événements du jeu"
category = "core"
role = "Fait communiquer les systèmes par événements plutôt que par dépendances directes."
keywords = ["evenements", "events", "signaux", "signals"]
network = "local"
tests = ["Un événement émis est reçu par tous ses abonnés"]
foundation = "all"

[[system]]
id = "game_data"
name = "Données de jeu"
category = "core"
role = "Décrit le contenu dans des fichiers de données (objets, ennemis, recettes) plutôt que dans le code."
keywords = ["data driven", "donnees", "tableur", "fiches", "scriptable object", "data asset"]
data = ["GameConfig"]
network = "local"
tests = ["Un nouveau contenu ajouté en données apparaît en jeu sans modifier le code"]
foundation = "all"

[[system]]
id = "ui_menus"
name = "Menus"
category = "ui"
role = "Écran titre, menu pause, écran de fin, navigation à la souris, au clavier et à la manette."
keywords = ["menu", "ecran titre", "menu principal", "main menu"]
depends = ["input"]
network = "clientOnly"
tests = ["Tous les menus sont utilisables à la manette et au clavier"]
foundation = "all"

[[system]]
id = "settings_menu"
name = "Réglages"
category = "ui"
role = "Graphismes, son, contrôles et accessibilité, enregistrés entre deux parties."
keywords = ["reglages", "options", "parametres", "settings"]
depends = ["ui_menus"]
data = ["UserSettings"]
network = "clientOnly"
tests = ["Les réglages modifiés sont relus au lancement suivant"]
foundation = "all"

[[system]]
id = "hud"
name = "HUD"
category = "ui"
role = "Informations de jeu à l'écran (vie, munitions, objectifs, score)."
keywords = ["hud", "interface de jeu", "barre de vie", "affichage tete haute"]
network = "clientOnly"
tests = ["Le HUD suit l'état réel du joueur"]
foundation = "all"

[[system]]
id = "audio_core"
name = "Audio et mixage"
category = "audio"
role = "Effets sonores, bus de mixage (musique, effets, voix, interface) et volumes réglables."
keywords = ["sons", "audio", "effets sonores", "bruitages", "sfx", "sound design"]
network = "clientOnly"
tests = ["Chaque bus de volume agit sur ses sons"]
foundation = "all"

[[system]]
id = "debug_tools"
name = "Outils de débogage"
category = "core"
role = "Console, affichage des FPS et superpositions de debug, absents des versions publiées."
keywords = ["debug", "console de debug", "triche de dev"]
network = "local"
tests = ["Les outils de debug sont absents d'un build de release"]
foundation = "all"

[[system]]
id = "lighting"
name = "Éclairage"
category = "visual"
role = "Lumières, ombres et ambiance ; précalculé ou dynamique selon la cible de performance."
keywords = ["eclairage", "lumiere", "ombres", "lighting", "illumination globale", "global illumination"]
network = "clientOnly"
tests = ["L'éclairage tient le budget de performance sur la plateforme visée"]
foundation = "3d"

[[system]]
id = "physics"
name = "Physique et collisions"
category = "core"
role = "Collisions, corps rigides, gravité et requêtes (rayons, zones)."
keywords = ["physique", "collisions", "gravite", "ragdoll", "corps rigides", "physics"]
network = "serverAuthority"
tests = ["Aucun objet ne traverse le sol à vitesse maximale"]


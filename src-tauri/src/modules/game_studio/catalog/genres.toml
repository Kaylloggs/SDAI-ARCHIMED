# Genres et références reconnus dans une idée.
#
# Un genre est DESCRIPTIF : il ajoute des systèmes et des valeurs par défaut (dimension,
# caméra, monde, réseau) que l'analyse enregistre comme hypothèses modifiables. Il ne limite
# jamais le projet : plusieurs genres se combinent, et une idée sans genre connu est analysée
# par ses systèmes seulement.
#
# Champs : label · keywords · systems · dimension (« 2d », « 2.5d », « 3d ») · camera (id d'un
# système de caméra) · world (voir GameWorldKind) · network (« coop », « competitive »,
# « massive ») · players (nombre typique, pour le réseau).

[[genre]]
label = "FPS"
keywords = ["fps", "first person shooter", "jeu de tir a la premiere personne", "shooter a la premiere personne"]
systems = ["shooting", "weapons", "health", "camera_first_person", "enemy_ai", "hud", "level_design"]
dimension = "3d"
camera = "camera_first_person"
world = "levelBased"


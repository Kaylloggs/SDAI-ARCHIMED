# Builds the Windows app with build.ps1 and publishes the GitHub release.
# Two ways to start it:
# - push a version tag vX.Y.Z (it must match the app version);
# - Actions tab > Release > Run workflow: publishes the version in tauri.conf.json of the chosen
#   branch, and the release creates the tag itself on the built commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Version to publish
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match the app version $tag"
          }
          # An existing tag must point at this commit: a new version needs a version bump first.
          $lines = git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}"
          $peeled = $lines | Where-Object { $_ -like "*^{}" } | Select-Object -First 1
          $line = if ($peeled) { $peeled } else { $lines | Select-Object -First 1 }
          if ($line -and $line.Split()[0] -ne $env:GITHUB_SHA) {
            throw "$tag is already published from another commit. Bump the version (pnpm version:bump minor) and try again."
          }
          Write-Output "Publishing $tag from $env:GITHUB_SHA"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Same toolchain as local builds: a newer clippy can add lints that fail -D warnings.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check, build and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build.ps1 -Bump none -Publish
